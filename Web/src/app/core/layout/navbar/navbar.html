<header class="bg-forest-700 text-cream-50">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <a routerLink="/" class="font-display text-xl text-cream-50">LibraEase</a>

    <nav class="flex items-center gap-6 text-sm">
      <a
        routerLink="/catalog"
        routerLinkActive="text-coral-300"
        class="text-cream-100 transition-colors hover:text-coral-300"
      >
        Catalog
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="text-coral-300"
        class="text-cream-100 transition-colors hover:text-coral-300"
      >
        My loans
      </a>
      @if (authStore.isAuthenticated() && authStore.isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="text-coral-300"
          class="text-cream-100 transition-colors hover:text-coral-300"
        >
          Admin
        </a>
      }

      @if (authStore.isAuthenticated()) {
        <span class="text-cream-100">{{ authStore.user()?.firstname }}</span>
        <button
          type="button"
          (click)="onSignOut()"
          class="rounded-md border border-forest-300 px-3 py-1.5 text-cream-50 transition-colors hover:bg-forest-500"
        >
          Sign out
        </button>
      } @else {
        <a
          routerLink="/login"
          class="rounded-md border border-forest-300 px-3 py-1.5 text-cream-50 transition-colors hover:bg-forest-500"
        >
          Sign in
        </a>
      }
    </nav>
  </div>
</header>
