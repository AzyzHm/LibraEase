<section class="mx-auto flex max-w-md flex-col px-6 py-16">
  <h1 class="font-display text-2xl text-ink-900">Sign in</h1>
  <p class="mt-1 text-sm text-ink-400">Welcome back to LibraEase.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-4" novalidate>
    <div>
      <label for="email" class="mb-1 block text-sm font-medium text-ink-900">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="w-full rounded-md border border-border bg-white px-3 py-2 text-sm text-ink-900 focus:border-forest-500 focus:outline-none"
      />
      @if (submitted() && form.controls.email.invalid) {
        <p class="mt-1 text-xs text-danger-500">Enter a valid email address.</p>
      }
    </div>

    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-ink-900">Password</label>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-md border border-border bg-white px-3 py-2 pr-10 text-sm text-ink-900 focus:border-forest-500 focus:outline-none"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          class="absolute inset-y-0 right-0 flex items-center px-3 text-ink-400 hover:text-ink-600"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.5a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.437 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          }
        </button>
      </div>
      @if (submitted() && form.controls.password.invalid) {
        <p class="mt-1 text-xs text-danger-500">Password is required.</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="rounded-md bg-danger-50 px-3 py-2 text-sm text-danger-700">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="mt-2 rounded-md bg-forest-700 px-4 py-2 text-sm font-medium text-cream-50 transition-colors hover:bg-forest-500 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-ink-400">
    Don't have an account?
    <a routerLink="/register" class="text-coral-500 underline">Register</a>
  </p>
</section>
