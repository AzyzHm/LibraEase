<section class="mx-auto flex max-w-md flex-col items-center px-6 py-16 sm:py-20">
  <img src="logo.png" alt="" width="48" height="48" class="h-12 w-12" />
  <h1 class="text-h1 mt-4 text-ink-900">Sign in</h1>
  <p class="text-body-sm mt-1 text-ink-400">Welcome back to LibraEase.</p>

  <div class="card-surface mt-8 w-full px-6 py-8 sm:px-8">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
      <div>
        <label for="email" class="field-label">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" class="field-input" />
        @if (submitted() && form.controls.email.invalid) {
          <p class="text-body-sm mt-1 text-danger-500">Enter a valid email address.</p>
        }
      </div>

      <div>
        <label for="password" class="field-label">Password</label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            class="field-input pr-10"
          />
          <app-password-visibility-toggle [visible]="showPassword()" (toggle)="togglePasswordVisibility()" />
        </div>
        @if (submitted() && form.controls.password.invalid) {
          <p class="text-body-sm mt-1 text-danger-500">Password is required.</p>
        }
      </div>

      @if (errorMessage()) {
        <p class="text-body-sm rounded-sm border-l-2 border-danger-500 bg-danger-50 px-3 py-2 text-danger-700">
          {{ errorMessage() }}
        </p>
      }

      <button type="submit" [disabled]="loading()" class="btn btn-primary mt-2 w-full">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>

  <p class="text-body-sm mt-6 text-ink-400">
    Don't have an account?
    <a routerLink="/register" class="font-medium text-coral-500 hover:text-coral-700">Register</a>
  </p>
</section>
