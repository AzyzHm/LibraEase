<section class="mx-auto flex max-w-md flex-col px-6 py-16">
  <h1 class="font-display text-2xl text-ink-900">Sign in</h1>
  <p class="mt-1 text-sm text-ink-400">Welcome back to LibraEase.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-4" novalidate>
    <div>
      <label for="email" class="mb-1 block text-sm font-medium text-ink-900">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="w-full rounded-md border border-border bg-white px-3 py-2 text-sm text-ink-900 focus:border-forest-500 focus:outline-none"
      />
      @if (submitted() && form.controls.email.invalid) {
        <p class="mt-1 text-xs text-danger-500">Enter a valid email address.</p>
      }
    </div>

    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-ink-900">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="w-full rounded-md border border-border bg-white px-3 py-2 text-sm text-ink-900 focus:border-forest-500 focus:outline-none"
      />
      @if (submitted() && form.controls.password.invalid) {
        <p class="mt-1 text-xs text-danger-500">Password is required.</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="rounded-md bg-danger-50 px-3 py-2 text-sm text-danger-700">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="mt-2 rounded-md bg-forest-700 px-4 py-2 text-sm font-medium text-cream-50 transition-colors hover:bg-forest-500 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-ink-400">
    Don't have an account?
    <a routerLink="/register" class="text-coral-500 underline">Register</a>
  </p>
</section>
