<div class="surface-scrim fixed inset-0 z-50 flex items-center justify-center px-4 py-8" (click)="onBackdropClick()">
  <div
    #panel
    class="flex max-h-full w-full flex-col overflow-hidden rounded-lg border border-border bg-white shadow-modal {{
      maxWidthClass()
    }}"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start justify-between gap-4 border-b border-border px-6 py-4">
      <div class="min-w-0">
        <h2 class="text-h2 truncate text-ink-900">{{ title() }}</h2>
        <ng-content select="[modalSubtitle]" />
      </div>
      <button
        type="button"
        (click)="onClose()"
        aria-label="Close"
        class="shrink-0 rounded-md p-1.5 text-ink-400 transition-colors hover:bg-cream-200 hover:text-ink-900"
      >
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M6 18L18 6" />
        </svg>
      </button>
    </div>

    <div class="overflow-y-auto px-6 py-5">
      <ng-content />
    </div>
  </div>
</div>
