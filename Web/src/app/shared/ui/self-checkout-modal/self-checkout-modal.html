<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-ink-900/50 px-4"
  (click)="onBackdropClick()"
>
  <div
    class="w-full max-w-md rounded-card border border-border bg-white p-6"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between">
      <h2 class="font-display text-xl text-ink-900">Borrow this book</h2>
      <button
        type="button"
        (click)="onClose()"
        aria-label="Close"
        class="rounded-md p-1 text-ink-400 transition-colors hover:bg-cream-200 hover:text-ink-900"
      >
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M6 18L18 6" />
        </svg>
      </button>
    </div>

    <p class="mt-1 text-sm text-ink-600">{{ book().title }}</p>

    @if (success()) {
      <p class="mt-4 rounded-md bg-success-50 px-3 py-2 text-sm text-success-700">
        Checked out. It's yours until the due date below - you can see it any time under "My loans".
      </p>
      <div class="mt-4 flex justify-end">
        <button
          type="button"
          (click)="onClose()"
          class="rounded-md bg-forest-700 px-4 py-2 text-sm font-medium text-cream-50 transition-colors hover:bg-forest-500"
        >
          Close
        </button>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-4 flex flex-col gap-4" novalidate>
        <div>
          <label for="checkout-due-date" class="mb-1 block text-sm font-medium text-ink-900">Due date</label>
          <input
            id="checkout-due-date"
            type="date"
            formControlName="dueDate"
            [min]="minDate"
            class="w-full rounded-md border border-border bg-white px-3 py-2 text-sm text-ink-900 focus:border-forest-500 focus:outline-none"
          />
          @if (submitted() && form.controls.dueDate.invalid) {
            <p class="mt-1 text-xs text-danger-500">Pick a date after today.</p>
          }
        </div>

        @if (error()) {
          <p class="rounded-md bg-danger-50 px-3 py-2 text-sm text-danger-700">{{ error() }}</p>
        }

        <div class="flex items-center justify-end gap-2">
          <button
            type="button"
            (click)="onClose()"
            class="rounded-md border border-border px-4 py-2 text-sm font-medium text-ink-600 transition-colors hover:bg-cream-200"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="saving()"
            class="rounded-md bg-forest-700 px-4 py-2 text-sm font-medium text-cream-50 transition-colors hover:bg-forest-500 disabled:cursor-not-allowed disabled:opacity-60"
          >
            {{ saving() ? 'Checking out…' : 'Confirm' }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
